name: document-search-platform

services:

  # MongoDB — source of truth for documents.
  #
  # Pinned to 7.0.x on purpose. MongoDB 8.x bundles a TCMalloc that violates the
  # rseq ABI enforced by Linux kernel 6.19+, which segfaults mongod ~30-60s after
  # startup (SERVER-121912). 8.0.28 and 8.3.x detect this and refuse to boot;
  # 8.2.x predates the guard and crashes silently, which is worse. 7.0.x bundles
  # an older TCMalloc and is unaffected.
  #
  # Revisit once an 8.x release ships the TCMalloc upgrade (SERVER-125742).
  mongodb:
    image: mongo:7.0.39
    container_name: dsp-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-documents}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # OpenSearch — search index. Single node, security plugin off for local dev.
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: dsp-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=dsp-cluster
      - node.name=dsp-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      # Local development only. Exposes plain HTTP on 9200 with no auth so we can
      # focus on mappings and Query DSL. Day 10 introduces the secured, AWS-ready setup.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # OpenSearch Dashboards — optional. Its Dev Tools console is the fastest way to
  # experiment with mappings, analyzers and Query DSL by hand.
  #     docker compose --profile tools up -d
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    container_name: dsp-opensearch-dashboards
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy

  # ZooKeeper — holds SolrCloud's cluster state: which nodes are live and which replica
  # leads each shard. SolrJ reads it directly, which is how the client keeps routing
  # correctly through leader elections and restarts without configuration changes.
  zookeeper:
    image: zookeeper:3.9
    container_name: dsp-zookeeper
    restart: unless-stopped
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
      # ruok is needed for the healthcheck below; the rest are useful for inspection.
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,mntr,conf,ruok"
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Apache Solr in SolrCloud mode. The second search backend; both are kept in step from
  # the application, behind one DocumentIndexPort interface.
  solr:
    image: solr:9.10.1
    container_name: dsp-solr
    restart: unless-stopped
    command: solr-foreground
    ports:
      - "${SOLR_PORT:-8983}:8983"
    environment:
      # Presence of ZK_HOST is what puts Solr into cloud rather than standalone mode.
      ZK_HOST: zookeeper:2181
      SOLR_HEAP: ${SOLR_HEAP:-512m}
    volumes:
      - solr-data:/var/solr
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8983/solr/admin/info/system?wt=json' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The application itself, containerised. Opt-in so the normal dev loop stays
  # ./mvnw spring-boot:run against the two datastores above.
  #     docker compose --profile app up -d --build
  app:
    build:
      context: .
    image: document-search-platform:0.1.0-SNAPSHOT
    container_name: dsp-app
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      # Container-network hostnames, not localhost: inside the container, localhost is
      # the container itself. The defaults baked into application.yml are for running
      # the app on the host with ./mvnw spring-boot:run.
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-change-me}@mongodb:27017/${MONGO_DATABASE:-documents}?authSource=admin
      OPENSEARCH_URI: http://opensearch:9200
      SOLR_ZK_HOST: zookeeper:2181
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      solr:
        condition: service_healthy

volumes:
  mongodb-data:
  opensearch-data:
  zookeeper-data:
  zookeeper-datalog:
  solr-data:
