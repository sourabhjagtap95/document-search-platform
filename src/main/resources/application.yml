spring:
  application:
    name: document-search-platform

# Bound to com.docsearch.config.ApplicationProperties.
# @project.version@ is substituted by Maven resource filtering at build time.
app:
  name: Document Search Platform
  version: '@project.version@'
  description: Document search over MongoDB and OpenSearch

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  # Puts the correlation id from CorrelationIdFilter on every log line.
  pattern:
    correlation: "[%X{correlationId:-}] "
  include-application-name: false
  level:
    com.docsearch: DEBUG
